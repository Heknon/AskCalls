name: Fast checks
description: >-
  Lint, typecheck, boundaries, and the unit and contract tests (PGlite and in-memory adapters,
  including the leak test), so no service container is needed. Run after ./.github/actions/setup.
  Every workflow runs these through this action, inside the job that deploys, so they cost no
  extra runner.
runs:
  using: composite
  steps:
    - name: Lint and format
      shell: bash
      run: bun run lint
    - name: Typecheck
      shell: bash
      run: bun run typecheck
    - name: Boundaries
      shell: bash
      run: bun run boundaries
    - name: Unit and contract tests
      shell: bash
      run: bun run test
