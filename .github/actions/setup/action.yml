name: Setup
description: >-
  Bun at the version in package.json (packageManager), a cached package store, and a frozen
  install. The install also brings the pinned Vercel and Neon CLIs (root devDependencies), so
  every workflow runs `bunx vercel` / `bunx neonctl` at the versions in bun.lock.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile
