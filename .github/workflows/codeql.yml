name: CodeQL

# Weekly and on pushes to master (spec 13, 14.1), not on every pull request: the analysis takes
# minutes and finds little that a week's wait changes. Run it by hand from Actions when needed.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# A newer push to master supersedes a running analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # TypeScript needs no build for CodeQL; skipping dependency install keeps the job short.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "**/test/**"
              - apps/web/e2e
              - docs
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
