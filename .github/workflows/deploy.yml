name: Deploy

# dev    → the dev environment on every push (dev Neon branch, askcalls-dev under dev/, DEV_DOMAIN)
# master → production on every push (a merged pull request), after the full suite passes.
#          The production environment only accepts master. Run workflow re-deploys a branch
#          without a new commit. Once production runs a version (apps/agent/package.json) that
#          has no tag yet, the release job tags it and starts release.yml.
#
# Order: AWS (CDK stacks, then the embedding model) → migrations → app. Migrations run before
# the code that needs them is live, so every migration must be backward compatible with the
# version still serving (docs/deployment.md). AWS goes first so a new bucket setting or model
# build is in place before the code that relies on it.
#
# Before the one-time setup (docs/deployment.md) the secrets are empty: dev still runs the fast
# checks, nothing is migrated or deployed, and the run says so.
on:
  push:
    branches: [dev, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# A deploy that started finishes: cancelling between the migration and the app deploy would
# leave the database ahead of the code for no reason.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# dev: the fast checks run in the deploy job itself, before anything is deployed (one runner,
# not two: GitHub bills each job rounded up to a whole minute); integration and E2E tests have
# run locally (CLAUDE.md).
# production: waits for the full suite (ci.yml, which includes the fast checks).
jobs:
  full-suite:
    if: github.ref_name == 'master'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ github.ref_name == 'master' && 'production' || 'dev' }}
    needs: full-suite
    # Runs when the full suite passed, or was skipped because this is dev.
    if: >-
      !cancelled() && !failure()
      && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    # A first deploy creates the CloudFront distribution, which takes several minutes.
    timeout-minutes: 40
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
      url: ${{ steps.app.outputs.url }}
    outputs:
      deployed: ${{ steps.cfg.outputs.deploy }}
    permissions:
      contents: read
      id-token: write # AWS OIDC (askcalls-github-deploy trusts only the dev and production environments)
    env:
      TARGET: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
      # The infra/ name of the environment (AskCallsStorage-<env>, askcalls:buckets.<env>).
      STACK_ENV: ${{ github.ref_name == 'master' && 'prod' || 'dev' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - if: env.TARGET == 'dev'
        uses: ./.github/actions/checks

      - name: Check the environment can deploy
        id: cfg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::The $TARGET environment is not set up yet (DATABASE_URL or VERCEL_TOKEN missing; docs/deployment.md, One-time setup). Nothing was migrated or deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The secrets are in, so a missing variable is a setup mistake, not a fresh repo.
          required="VERCEL_ORG_ID VERCEL_PROJECT_ID AWS_REGION AWS_DEPLOY_ROLE_ARN"
          if [ "$TARGET" = dev ]; then required="$required DEV_DOMAIN"; fi
          missing=""
          for v in $required; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables missing:$missing (docs/deployment.md, GitHub)"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.cfg.outputs.deploy == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # AskCallsGithubDeploy (the roles this job assumes) is deployed by hand, never here.
      - name: Deploy AWS infrastructure
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: infra
        run: |
          stacks=("AskCallsStorage-$STACK_ENV")
          # The model CDN is shared by every environment; production owns it.
          if [ "$STACK_ENV" = prod ]; then stacks+=(AskCallsModels); fi
          bunx cdk deploy "${stacks[@]}" --require-approval never --no-notices

      # Idempotent: a few HEAD requests when the pinned build is already there. Runs on dev too,
      # so a dev deploy that pins a new build never serves a model the CDN doesn't have.
      - name: Publish the embedding model
        if: steps.cfg.outputs.deploy == 'true'
        run: |
          url=$(aws cloudformation describe-stacks --stack-name AskCallsModels \
            --query "Stacks[0].Outputs[?OutputKey=='ModelsUrl'].OutputValue" --output text 2>/dev/null || true)
          if [ -z "$url" ] || [ "$url" = None ]; then
            if [ "$STACK_ENV" = prod ]; then
              echo "::error::Could not read AskCallsModels' ModelsUrl output right after deploying it"
              exit 1
            fi
            echo "::notice::AskCallsModels is not deployed yet (the first production deploy creates it); the model was not published."
            exit 0
          fi
          context() { jq -r ".context[\"askcalls:$1\"]$2" infra/cdk.json; }
          MODELS_S3_BUCKET=$(context modelsBucket) \
          MODELS_S3_REGION="$AWS_REGION" \
          MODELS_PUBLIC_URL="$url" \
          MODELS_CHECK_ORIGINS=$(context appOrigins ".${STACK_ENV}[0]") \
            bun run models:publish

      - name: Apply database migrations
        if: steps.cfg.outputs.deploy == 'true'
        run: bun run --cwd packages/adapters/db-postgres migrate
        env:
          # The direct (unpooled) URL; the app's pooled URL lives in Vercel.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy the app
        id: app
        if: steps.cfg.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
        run: |
          vercel() { bunx vercel "$@" --token="$VERCEL_TOKEN"; }
          if [ "$TARGET" = production ]; then
            vercel pull --yes --environment=production
            vercel build --prod
            url=$(vercel deploy --prebuilt --prod)
          else
            # Preview-scoped variables, narrowed to the dev branch where set.
            vercel pull --yes --environment=preview --git-branch=dev
            vercel build
            # DEV_DOMAIN is a project domain assigned to the dev branch in Vercel, so this
            # deployment (built from a dev checkout) takes it over automatically.
            vercel deploy --prebuilt
            url="https://$DEV_DOMAIN"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Bumping the version in apps/agent/package.json is how a release is asked for: npm, the image,
  # the offline bundles and the GitHub release follow once production runs it. A tag pushed with
  # this job's token starts no workflow, so the job starts release.yml on the tag itself.
  release:
    name: Tag the release
    needs: deploy
    if: github.ref_name == 'master' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
      actions: write # start release.yml
    steps:
      - uses: actions/checkout@v7
      - name: Tag a new version and start its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version apps/agent/package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already tagged; nothing to release."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
          echo "::notice::Tagged $tag on $GITHUB_SHA and started its release."
