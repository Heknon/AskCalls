name: Full tests

# The full suite: integration and E2E tests, plus the fast checks (./.github/actions/checks).
# Runs only when asked for, since they are cheap to run locally before pushing (CLAUDE.md):
# - before a production release (deploy.yml calls it);
# - on a pull request, by adding the `full-tests` label (remove and re-add it to run again);
# - by hand: Actions → Full tests → Run workflow.
#
# Two jobs in parallel so a release waits for the slower one (E2E), not their sum. The fast
# checks ride in the integration job, the shorter of the two.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [labeled]

# github.workflow is the caller's name under workflow_call, so a hand-started run on master
# never cancels the suite a production deploy is waiting for.
concurrency:
  group: full-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Fast checks and integration tests
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A superuser URL: each suite creates its own database owned by a CREATEROLE role, like
      # Neon's owner (packages/adapters/db-postgres/src/int-support.ts).
      ASKCALLS_TEST_PG_URL: postgres://postgres:test@localhost:5432/postgres
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_REGION: us-east-1
      S3_TEST_ACCESS_KEY_ID: minioadmin
      S3_TEST_SECRET_ACCESS_KEY: minioadmin
    steps:
      # Service containers can't be given a command, and MinIO's image needs `server <dir>`.
      # Started first so it boots while dependencies install. The tests create their own buckets.
      - name: Start MinIO
        run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY_ID"
          -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_ACCESS_KEY"
          pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks
      - name: Wait for MinIO
        run: |
          for _ in $(seq 30); do
            curl -fsS "$S3_TEST_ENDPOINT/minio/health/ready" && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Integration tests
        run: bun run test:integration

  e2e:
    name: E2E tests (Chromium)
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-tests'
    # Playwright installs its browser dependencies with apt for the Ubuntu release it knows.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Headless runs only need the headless shell. A cache hit still needs the system
      # libraries, which live outside the cache.
      - name: Install Playwright browsers
        working-directory: apps/web
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps --only-shell chromium
          fi
      # Builds the app, then runs it with the in-memory adapters (apps/web/playwright.config.ts).
      - name: E2E tests
        run: bun run test:e2e
        env:
          # The smoke tests never embed, so the 118 MB model download is skipped.
          ASKCALLS_SKIP_MODEL_DOWNLOAD: "1"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
