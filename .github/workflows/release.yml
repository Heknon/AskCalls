name: Release

# Every successful production deploy (deploy.yml on master) may publish a release (spec 14.1):
# when the agent's version (apps/agent/package.json) has no `v<version>` tag yet, this tags the
# deployed commit and publishes, in one job:
#   build → client asset hashes → tag → npm (agent) → Docker image to GHCR (multi-arch only here)
#   → offline bundles → GitHub release with every checksum in its notes.
# A merge that doesn't change the version publishes nothing. To release, bump the version in a
# pull request. `bun run release:dry-run` does the same locally without publishing anything.
#
# The full suite ran before production, so only the fast checks run here. The agent goes to npm
# by trusted publishing (OIDC, no token): npm trusts this workflow in the `production`
# environment for the `askcalls` package (docs/deployment.md, npm).
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [master]

# A release that started finishes: a half-published version is worse than a late one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Version to release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read the version
        id: v
        run: |
          version=$(jq -r .version apps/agent/package.json)
          if ! [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "::error::apps/agent/package.json version $version is not <major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released (or 0.0.0); nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # npm's trusted publisher for `askcalls` names this environment; it only accepts master.
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DIST: dist/release
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup

      - name: Read the version
        id: v
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Builds the web app (with the model, like production) and checks it.
      - name: Build the web app
        run: bun run --cwd apps/web build
      - uses: ./.github/actions/checks

      - name: Hash the client assets
        run: |
          mkdir -p "$DIST/images"
          bun scripts/release/client-hashes.ts --out "$DIST/client-assets.sha256"

      - name: Tag the deployed commit
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run after a later step failed finds the tag already on this commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-list -n 1 "$TAG")" != "$SHA" ]; then
              echo "::error::$TAG already exists on another commit"
              exit 1
            fi
          else
            git tag -a "$TAG" -m "AskCalls $TAG" "$SHA"
            git push origin "$TAG"
          fi

      - name: Build the agent
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          bun scripts/release/agent-package.ts --version "$VERSION"
          (cd apps/agent/dist/npm && npm pack --pack-destination "$GITHUB_WORKSPACE/$DIST")
          bun scripts/release/agent-binaries.ts --all --out "$DIST/agent"

      # No registry-url: setup-node would write an .npmrc with a token placeholder, and trusted
      # publishing needs no token at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Trusted publishing exchanges this job's OIDC token (id-token: write) for a short-lived
      # publish credential; it needs npm 11.5.1 or later (Node 22 ships 10), and attaches
      # provenance itself.
      - name: Install npm for trusted publishing
        run: npm install -g npm@11.6.0

      - name: Publish the agent to npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if ! npm view askcalls name >/dev/null 2>&1; then
            echo "::notice::askcalls is not on npm yet. Publish the first version by hand, then add this workflow as its trusted publisher (docs/deployment.md, npm)."
            exit 0
          fi
          if npm view "askcalls@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::askcalls@$VERSION is already on npm; not published again."
            exit 0
          fi
          npm publish "$DIST/askcalls-$VERSION.tgz" --access public

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: ASKCALLS_BUILD_ID=${{ env.SHA }}
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same build, from the layer cache, as one `docker load`-able tarball per architecture.
      - name: Export the images for the offline bundles
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build -f docker/Dockerfile --platform "linux/$arch" \
              --build-arg "ASKCALLS_BUILD_ID=$SHA" --cache-from type=gha \
              -t "$IMAGE:$VERSION" \
              --output "type=docker,dest=$DIST/images/askcalls-$VERSION-$arch.tar" .
          done

      - name: Assemble the offline bundles and release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bun scripts/release/assemble.ts --version "$VERSION" --dist "$DIST"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          cd "$DIST"
          gh release create "$TAG" --verify-tag --title "AskCalls $VERSION" \
            --notes-file release-notes.md \
            askcalls-offline-"$VERSION"-*.tar.gz "askcalls-$VERSION.tgz" agent/askcalls-* \
            client-assets.sha256 SHA256SUMS
