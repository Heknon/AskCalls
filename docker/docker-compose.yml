# Self-hosting: Postgres with pgvector, MinIO and the web app.
#   cd docker && docker compose up
# Then open http://localhost:3000. Settings not set here are edited in the first-run wizard.
name: askcalls

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askcalls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askcalls}
      POSTGRES_DB: askcalls
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askcalls"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-askcalls}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-askcalls-minio}
    ports:
      - "9000:9000"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-askcalls} $${MINIO_ROOT_PASSWORD:-askcalls-minio}
      && mc mb --ignore-existing local/askcalls"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_DRIVER: postgres
      DATABASE_URL: postgres://askcalls:${POSTGRES_PASSWORD:-askcalls}@postgres:5432/askcalls
      # Apply pending migrations on start; an advisory lock makes concurrent starts safe.
      DB_MIGRATE_ON_BOOT: "true"
      BLOB_DRIVER: s3
      # Browsers upload encrypted recordings straight to this endpoint, so it must be reachable from them.
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: askcalls
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-askcalls}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-askcalls-minio}
    volumes:
      - data:/data

volumes:
  postgres:
  minio:
  data:
